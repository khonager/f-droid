name: Publish F-Droid Repo

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: ["main"]
    paths:
      - "metadata/**"
      - "scripts/**"
      - "fdroid-config.template.yml"
      - ".github/workflows/publish.yml"
      - "README.md"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fdroidserver
        run: |
          python -m pip install --upgrade pip
          pip install fdroidserver

      - name: Fetch latest stable APK from khonager/Trans
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRANS_OWNER: khonager
          TRANS_REPO: Trans
          TRANS_STABLE_ASSET_NAME: trans.apk
        run: |
          ./scripts/fetch_trans_stable_apk.sh metadata/apks

      - name: Restore F-Droid keystore
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$FDROID_KEYSTORE_BASE64" | base64 -d > /tmp/fdroid-keystore.jks

      - name: Build runtime config
        env:
          FDROID_REPO_URL: ${{ vars.FDROID_REPO_URL }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          cp fdroid-config.template.yml config.yml
          sed -i "s|\${FDROID_REPO_URL}|${FDROID_REPO_URL}|g" config.yml
          sed -i "s|\${FDROID_KEYSTORE_PASSWORD}|${FDROID_KEYSTORE_PASSWORD}|g" config.yml
          sed -i "s|\${FDROID_KEY_ALIAS}|${FDROID_KEY_ALIAS}|g" config.yml
          sed -i "s|\${FDROID_KEY_PASSWORD}|${FDROID_KEY_PASSWORD}|g" config.yml

      - name: Copy APKs into repo
        run: |
          mkdir -p repo
          rm -f repo/*.apk
          cp -f metadata/apks/*.apk repo/

      - name: Update F-Droid index
        run: |
          fdroid update --verbose

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      - name: Cleanup config
        if: always()
        run: rm -f config.yml
