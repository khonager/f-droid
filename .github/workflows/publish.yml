name: Publish F-Droid Repo

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "metadata/**"
      - "scripts/**"
      - "fdroid-config.template.yml"
      - ".github/workflows/publish.yml"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install fdroidserver
        run: |
          python -m pip install --upgrade pip
          pip install fdroidserver

      - name: Restore F-Droid keystore
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$FDROID_KEYSTORE_BASE64" | base64 -d > /tmp/fdroid-keystore.jks

      - name: Build runtime config
        env:
          FDROID_REPO_URL: ${{ vars.FDROID_REPO_URL }}
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
          FDROID_KEY_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
          FDROID_KEY_PASSWORD: ${{ secrets.FDROID_KEY_PASSWORD }}
        run: |
          cp fdroid-config.template.yml /tmp/fdroid-config.yml
          sed -i "s|\${FDROID_REPO_URL}|${FDROID_REPO_URL}|g" /tmp/fdroid-config.yml
          sed -i "s|\${FDROID_KEYSTORE_PASSWORD}|${FDROID_KEYSTORE_PASSWORD}|g" /tmp/fdroid-config.yml
          sed -i "s|\${FDROID_KEY_ALIAS}|${FDROID_KEY_ALIAS}|g" /tmp/fdroid-config.yml
          sed -i "s|\${FDROID_KEY_PASSWORD}|${FDROID_KEY_PASSWORD}|g" /tmp/fdroid-config.yml

      - name: Copy APKs into repo
        run: |
          mkdir -p repo
          cp -f metadata/apks/*.apk repo/ 2>/dev/null || true

      - name: Update F-Droid index
        run: |
          fdroid update --config /tmp/fdroid-config.yml --verbose

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
